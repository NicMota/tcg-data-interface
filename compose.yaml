services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tcg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tcg-data:
